<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Quiz de análise SWOT com 10 cenários empresariais reais. Teste seus conhecimentos e entre no ranking." />
<title>Quiz SWOT — Illuminati</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- SDK do Supabase com defer — NÃO bloqueia a renderização -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

<style>
:root {
  --bg-base:        oklch(0.145 0.015 25);
  --bg-elevated-1:  oklch(0.185 0.018 25);
  --bg-elevated-2:  oklch(0.225 0.020 25);
  --bg-elevated-3:  oklch(0.265 0.022 25);

  --text-primary:   oklch(0.975 0.006 80);
  --text-secondary: oklch(0.720 0.014 25);
  --text-tertiary:  oklch(0.560 0.018 25);

  --accent:         oklch(0.580 0.220 25);
  --accent-hover:   oklch(0.625 0.230 25);
  --accent-soft:    oklch(0.580 0.220 25 / 0.12);
  --accent-border:  oklch(0.580 0.220 25 / 0.35);

  --border-subtle:  oklch(100% 0 0 / 0.08);
  --border-strong:  oklch(100% 0 0 / 0.14);

  --swot-s: oklch(0.62 0.18 145);
  --swot-w: oklch(0.68 0.18 55);
  --swot-o: oklch(0.78 0.16 90);
  --swot-t: oklch(0.62 0.18 300);

  --gold: oklch(0.82 0.14 85);

  --font-display: 'Fraunces', 'Times New Roman', serif;
  --font-body:    'Outfit', system-ui, -apple-system, sans-serif;

  --text-xs:   clamp(0.7rem, 0.65rem + 0.25vw, 0.75rem);
  --text-sm:   clamp(0.8rem, 0.75rem + 0.25vw, 0.875rem);
  --text-base: clamp(0.9rem, 0.85rem + 0.25vw, 1rem);
  --text-lg:   clamp(1rem, 0.9rem + 0.5vw, 1.125rem);
  --text-xl:   clamp(1.25rem, 1.1rem + 0.75vw, 1.5rem);
  --text-2xl:  clamp(1.5rem, 1.2rem + 1.5vw, 2rem);
  --text-3xl:  clamp(1.75rem, 1.3rem + 2.25vw, 2.625rem);
  --text-4xl:  clamp(2rem, 1.4rem + 3vw, 3.5rem);
  --text-5xl:  clamp(2.5rem, 1.6rem + 4.5vw, 4.5rem);

  --space-1:  clamp(0.2rem, 0.15rem + 0.25vw, 0.25rem);
  --space-2:  clamp(0.4rem, 0.3rem + 0.5vw, 0.5rem);
  --space-3:  clamp(0.6rem, 0.5rem + 0.5vw, 0.75rem);
  --space-4:  clamp(0.8rem, 0.7rem + 0.5vw, 1rem);
  --space-5:  clamp(1rem, 0.9rem + 0.5vw, 1.5rem);
  --space-6:  clamp(1.25rem, 1.1rem + 0.75vw, 2rem);
  --space-7:  clamp(1.5rem, 1.3rem + 1vw, 2.5rem);
  --space-8:  clamp(2rem, 1.7rem + 1.5vw, 3rem);
  --space-9:  clamp(2.5rem, 2rem + 2.5vw, 4rem);
  --space-10: clamp(3rem, 2.5rem + 2.5vw, 5rem);

  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 18px;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --duration: 320ms;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.6;
  color: var(--text-primary);
  background-color: var(--bg-base);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, oklch(0.58 0.22 25 / 0.08), transparent 60%),
    radial-gradient(ellipse 60% 40% at 100% 100%, oklch(0.58 0.22 25 / 0.04), transparent 60%);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: var(--radius-sm);
}

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
img, svg { display: block; max-width: 100%; }

.app {
  position: relative;
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-3) var(--space-4);
  background: oklch(0.145 0.015 25 / 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-subtle);
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: var(--text-base);
  letter-spacing: -0.01em;
}

.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--accent), oklch(0.45 0.18 25));
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--text-primary);
  font-size: var(--text-sm);
  box-shadow: inset 0 0 0 1px oklch(100% 0 0 / 0.15);
}

.topbar-nav {
  display: flex;
  gap: var(--space-2);
}

.nav-link {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  min-height: 40px;
  border-radius: var(--radius-md);
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--text-secondary);
  text-decoration: none;
  border: 1px solid var(--border-subtle);
  transition: all var(--duration) var(--ease);
}
.nav-link:hover {
  color: var(--text-primary);
  background: var(--bg-elevated-1);
  border-color: var(--border-strong);
}
.nav-link:active { transform: scale(0.97); }
.nav-link svg { width: 14px; height: 14px; }

main {
  flex: 1;
  width: 100%;
  max-width: 780px;
  margin: 0 auto;
  padding: var(--space-6) var(--space-4) var(--space-8);
}

.screen {
  display: none;
  animation: screenIn var(--duration) var(--ease) both;
}
.screen.is-active { display: block; }

@keyframes screenIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: var(--space-4);
}
.eyebrow::before {
  content: '';
  width: 24px;
  height: 1px;
  background: var(--accent);
}

.display {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: var(--text-4xl);
  line-height: 1.05;
  letter-spacing: -0.03em;
  color: var(--text-primary);
  margin-bottom: var(--space-4);
  font-variation-settings: "opsz" 144;
}
.display em {
  font-style: italic;
  color: var(--accent);
  font-weight: 500;
}

.lede {
  font-size: var(--text-lg);
  line-height: 1.6;
  color: var(--text-secondary);
  max-width: 55ch;
  margin-bottom: var(--space-6);
}

.card {
  position: relative;
  background: var(--bg-elevated-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  overflow: hidden;
}

.card--hero {
  padding: var(--space-7) var(--space-6);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.card--hero::before {
  content: '';
  position: absolute;
  top: -120px;
  left: 50%;
  transform: translateX(-50%);
  width: 400px;
  height: 240px;
  background: radial-gradient(ellipse, oklch(0.58 0.22 25 / 0.18), transparent 70%);
  pointer-events: none;
}

.welcome-badge {
  position: relative;
  width: 72px;
  height: 72px;
  border-radius: 18px;
  background: oklch(from var(--accent) l c h / 0.14);
  display: grid;
  place-items: center;
  margin-bottom: var(--space-4);
  border: 1px solid var(--accent-border);
}

.welcome-badge svg {
  width: 36px;
  height: 36px;
  color: var(--accent);
}

.welcome-meta {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--space-2);
  margin-bottom: var(--space-5);
}

.meta-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-1) var(--space-3);
  background: var(--bg-elevated-2);
  border: 1px solid var(--border-subtle);
  border-radius: 999px;
  font-size: var(--text-xs);
  color: var(--text-secondary);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-weight: 500;
}
.meta-chip svg { width: 12px; height: 12px; }
.meta-chip strong { color: var(--text-primary); font-weight: 600; text-transform: none; letter-spacing: 0; }

.rules-grid {
  position: relative;
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-3);
  width: 100%;
  max-width: 480px;
  margin-bottom: var(--space-6);
}

.rule-item {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: var(--bg-elevated-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  text-align: left;
}

.rule-icon {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: oklch(from var(--accent) l c h / 0.15);
  color: var(--accent);
  display: grid;
  place-items: center;
}
.rule-icon svg { width: 16px; height: 16px; }

.rule-text {
  font-size: var(--text-sm);
  color: var(--text-secondary);
  line-height: 1.5;
}
.rule-text strong { color: var(--text-primary); font-weight: 600; }

.input-group {
  position: relative;
  width: 100%;
  max-width: 420px;
  margin-bottom: var(--space-4);
}

.input-label {
  display: block;
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: var(--space-2);
  text-align: left;
}

.input-text {
  width: 100%;
  padding: var(--space-3) var(--space-4);
  min-height: 52px;
  background: var(--bg-elevated-2);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: var(--text-base);
  transition: all var(--duration) var(--ease);
}

.input-text::placeholder {
  color: var(--text-tertiary);
}

.input-text:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--bg-elevated-3);
  box-shadow: 0 0 0 4px oklch(from var(--accent) l c h / 0.15);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  min-height: 48px;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  letter-spacing: 0.02em;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  transition: all var(--duration) var(--ease);
  white-space: nowrap;
  text-decoration: none;
}
.btn:active { transform: scale(0.98); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn[disabled]:hover { transform: none; }

.btn-primary {
  background: var(--accent);
  color: var(--text-primary);
  box-shadow: 0 1px 0 oklch(100% 0 0 / 0.15) inset, 0 8px 24px -8px oklch(0.58 0.22 25 / 0.5);
}
.btn-primary:hover:not([disabled]) {
  background: var(--accent-hover);
  transform: translateY(-1px);
  box-shadow: 0 1px 0 oklch(100% 0 0 / 0.2) inset, 0 12px 28px -8px oklch(0.58 0.22 25 / 0.6);
}

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  border-color: var(--border-subtle);
}
.btn-ghost:hover:not([disabled]) {
  color: var(--text-primary);
  background: var(--bg-elevated-1);
  border-color: var(--border-strong);
}

.btn-block { width: 100%; }
.btn svg { width: 16px; height: 16px; }

.btn-stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  width: 100%;
  max-width: 360px;
}

.ranking-preview {
  width: 100%;
  max-width: 480px;
  margin-top: var(--space-6);
  padding-top: var(--space-5);
  border-top: 1px solid var(--border-subtle);
}

.ranking-preview-title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: var(--space-3);
}
.ranking-preview-title svg { width: 14px; height: 14px; color: var(--gold); }

.ranking-preview-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.ranking-preview-item {
  display: grid;
  grid-template-columns: 32px 1fr auto;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  background: var(--bg-elevated-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
}

.ranking-pos {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--bg-elevated-3);
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: var(--text-xs);
  color: var(--text-secondary);
}
.ranking-pos.top-1 { background: oklch(from var(--gold) l c h / 0.2); color: var(--gold); }
.ranking-pos.top-2 { background: oklch(0.75 0.04 250 / 0.18); color: oklch(0.80 0.04 250); }
.ranking-pos.top-3 { background: oklch(0.65 0.08 50 / 0.18); color: oklch(0.72 0.10 50); }

.ranking-name {
  font-size: var(--text-sm);
  color: var(--text-primary);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ranking-score {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: var(--text-sm);
  color: var(--accent);
}

.ranking-empty {
  padding: var(--space-4);
  text-align: center;
  color: var(--text-tertiary);
  font-style: italic;
  font-size: var(--text-sm);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-md);
}

.quiz-shell {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

.quiz-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.player-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-1) var(--space-3);
  background: var(--bg-elevated-1);
  border: 1px solid var(--border-subtle);
  border-radius: 999px;
  font-size: var(--text-xs);
  color: var(--text-secondary);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-weight: 500;
}
.player-chip strong { color: var(--text-primary); font-weight: 600; text-transform: none; letter-spacing: 0; }

.timer {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-1) var(--space-3);
  background: var(--bg-elevated-1);
  border: 1px solid var(--border-subtle);
  border-radius: 999px;
  font-family: var(--font-display);
  font-size: var(--text-base);
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
  transition: all var(--duration) var(--ease);
}
.timer svg { width: 14px; height: 14px; color: var(--text-tertiary); }

.timer.is-warning {
  color: var(--accent);
  border-color: var(--accent-border);
  background: var(--accent-soft);
  animation: pulse 1.2s ease-in-out infinite;
}
.timer.is-warning svg { color: var(--accent); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

.progress {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.progress-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: var(--text-sm);
  color: var(--text-secondary);
}
.progress-meta strong {
  color: var(--text-primary);
  font-weight: 600;
  font-family: var(--font-display);
  font-size: var(--text-lg);
  letter-spacing: -0.01em;
}

.progress-track {
  position: relative;
  height: 4px;
  background: var(--bg-elevated-2);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), oklch(0.68 0.22 25));
  border-radius: 2px;
  transition: width 500ms var(--ease);
}

.question-card {
  padding: var(--space-5);
  animation: questionIn 420ms var(--ease) both;
}

@keyframes questionIn {
  from { opacity: 0; transform: translateX(16px); }
  to { opacity: 1; transform: translateX(0); }
}

.question-label {
  font-family: var(--font-display);
  font-size: var(--text-xs);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: var(--space-3);
}

.company-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-1) var(--space-3);
  background: var(--bg-elevated-2);
  border: 1px solid var(--border-subtle);
  border-radius: 999px;
  font-size: var(--text-xs);
  color: var(--text-secondary);
  font-weight: 500;
  margin-bottom: var(--space-3);
}
.company-badge svg { width: 12px; height: 12px; }

.question-context {
  font-size: var(--text-sm);
  color: var(--text-secondary);
  line-height: 1.65;
  margin-bottom: var(--space-4);
  padding: var(--space-3) var(--space-4);
  background: var(--bg-elevated-2);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm);
}

.question-text {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.015em;
  color: var(--text-primary);
  margin-bottom: var(--space-5);
  font-variation-settings: "opsz" 120;
}

.choices {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.choice {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-4);
  background: var(--bg-elevated-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  text-align: left;
  color: var(--text-primary);
  min-height: 56px;
  transition: all var(--duration) var(--ease);
  width: 100%;
}
.choice:hover {
  background: var(--bg-elevated-3);
  border-color: var(--border-strong);
  transform: translateX(4px);
}
.choice:active {
  transform: translateX(2px) scale(0.995);
}

.choice.is-selected {
  background: var(--quadrant-soft);
  border-color: var(--quadrant-color);
}

.choice-indicator {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1.5px solid var(--border-strong);
  background: var(--bg-elevated-1);
  display: grid;
  place-items: center;
  transition: all var(--duration) var(--ease);
}

.choice.is-selected .choice-indicator {
  background: var(--quadrant-color);
  border-color: var(--quadrant-color);
  color: var(--text-primary);
}

.choice-indicator svg {
  width: 14px;
  height: 14px;
  opacity: 0;
  transform: scale(0.5);
  transition: all var(--duration) var(--ease);
}

.choice.is-selected .choice-indicator svg {
  opacity: 1;
  transform: scale(1);
}

.choice-letter {
  font-family: var(--font-display);
  font-size: var(--text-sm);
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--text-tertiary);
  margin-right: var(--space-1);
}

async function getRanking() {

      console.warn('[Supabase] Não conectado. Retornando ranking vazio.');
      return [];

    const { data, error } = await supabaseClient
      .from('quiz_results')
      .select('nome, acertos, tempo_segundos, created_at')
      .eq('quiz_type', 'illuminati')
      .order('acertos', { ascending: false })

      state.tempoRestante = 0;
      state.tela = 'tempoExpirado';

function dispararConfete() {
  const canvas = document.createElement('canvas');
  canvas.id = 'confetti-canvas';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  const cores = ['#E50914', '#F4F4F5', '#FFB800', '#00C2A8', '#4A90E2', '#A855F7'];
  const particulas = [];
  const total = 140;

  for (let i = 0; i < total; i++) {
    particulas.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * canvas.height * 0.5,
      w: 6 + Math.random() * 6,
      h: 8 + Math.random() * 10,
      cor: cores[Math.floor(Math.random() * cores.length)],
      velY: 2 + Math.random() * 3,
      velX: -1.5 + Math.random() * 3,
      rot: Math.random() * 360,
      velRot: -6 + Math.random() * 12
    });
  }

  let frames = 0;
  const maxFrames = 240;

  function animar() {
    frames++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particulas.forEach(p => {
      p.x += p.velX;
      p.y += p.velY;
      p.rot += p.velRot;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rot * Math.PI) / 180);
      ctx.fillStyle = p.cor;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    if (frames < maxFrames) {
      requestAnimationFrame(animar);
    } else {
      canvas.remove();
    }
  }
  requestAnimationFrame(animar);
}

function renderRankingPreview(ranking) {
  const top5 = ranking.slice(0, 5);
  if (top5.length === 0) {
    return `
      <div class="ranking-preview" aria-label="Ranking">
        <div class="ranking-preview-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
          Top jogadores
        </div>
        <div class="ranking-empty">Ainda não há jogadas registradas. Seja a primeira!</div>
      </div>
    `;
  }

  const items = top5.map((r, i) => {
    const posClass = i === 0 ? 'top-1' : i === 1 ? 'top-2' : i === 2 ? 'top-3' : '';
    return `
      <div class="ranking-preview-item">
        <div class="ranking-pos ${posClass}">${i + 1}</div>
        <div class="ranking-name">${escapeHtml(r.nome)}</div>
        <div class="ranking-score">${r.acertos}/${perguntas.length}</div>

  return `
    <div class="ranking-preview" aria-label="Ranking">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>

function renderQuiz() {
  const idx = state.perguntaAtual;
  const p = perguntas[idx];
  const total = perguntas.length;
  const current = idx + 1;
  const pct = Math.round((current / total) * 100);
  const respostaSelecionada = state.respostas[idx];
  const isUltima = idx === total - 1;

  const opcoesHtml = p.opcoes.map((op, i) => {
    const selected = respostaSelecionada === i;
    const letters = ['A', 'B', 'C', 'D'];
    return `
      <button
        type="button"
        class="choice ${selected ? 'is-selected' : ''}"
        data-opcao="${i}"
        data-quadrant="${op.quadrante}"
        role="radio"
        aria-checked="${selected ? 'true' : 'false'}"
      >
        <div class="choice-indicator" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <span class="choice-letter">${letters[i]}</span>
        <span class="choice-text">${escapeHtml(op.texto)}</span>
        <span class="choice-quadrant-dot" aria-hidden="true"></span>
      </button>
    `;
  }).join('');

  const timerWarning = state.tempoRestante <= 30 ? 'is-warning' : '';

  return `
    <section class="screen is-active" aria-labelledby="quiz-title">
      <div class="quiz-shell">

        <div class="quiz-topbar">
          <div class="player-chip">
            Jogador: <strong>${escapeHtml(state.nome)}</strong>
          </div>
          <div class="timer ${timerWarning}" id="timerWrapper" aria-label="Tempo restante">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="timerDisplay">${formatarTempo(state.tempoRestante)}</span>
          </div>
        </div>

        <div class="progress" role="group" aria-label="Progresso do quiz">
          <div class="progress-meta">
            <span id="quiz-title">Pergunta <strong>${current}</strong> de <strong>${total}</strong></span>
            <span>${pct}%</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill" style="width: ${pct}%"></div>
          </div>
        </div>

        <article class="card question-card" id="question-card">
          <div class="question-label">Pergunta ${String(current).padStart(2, '0')}</div>

          <div class="company-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M9 8h1M9 12h1M9 16h1M14 8h1M14 12h1M14 16h1M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"/></svg>
            ${escapeHtml(p.empresa)} · ${escapeHtml(p.segmento)}
          </div>

          <div class="question-context">${escapeHtml(p.contexto)}</div>

          <h2 class="question-text">${escapeHtml(p.pergunta)}</h2>

          <div class="choices" role="radiogroup" aria-label="Alternativas">
            ${opcoesHtml}
          </div>
        </article>

        <nav class="quiz-nav" aria-label="Navegação do quiz">
          <button class="btn btn-ghost" id="btnAnterior" ${idx === 0 ? 'disabled' : ''}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Anterior
          </button>
          <button class="btn btn-primary" id="btnProximo" ${respostaSelecionada === null ? 'disabled' : ''}>
            ${isUltima ? 'Finalizar Quiz' : 'Próxima'}
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </nav>

      </div>
    </section>
  `;
}

function renderResultado() {
  const score = state.scoreAtual;
  const ganhou = score >= MIN_ACERTOS;
  const pct = Math.round((score / perguntas.length) * 100);

  const reviewHtml = perguntas.map((p, i) => {
    const respostaUsuario = state.respostas[i];
    const correta = respostaUsuario === p.respostaCorreta;
    const statusIcon = correta
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>`;

    const respostaUsuarioTexto = respostaUsuario !== null ? p.opcoes[respostaUsuario].texto : 'Não respondida';
    const respostaCorretaTexto = p.opcoes[p.respostaCorreta].texto;

    return `
      <div class="review-item ${correta ? 'is-correct' : 'is-wrong'}">
        <div class="review-item-header">
          <div class="review-number">${i + 1}</div>
          <div class="review-company">${escapeHtml(p.empresa)}</div>
          <div class="review-status">
            ${statusIcon}
            ${correta ? 'Correto' : 'Incorreto'}
          </div>
        </div>
        <div class="review-question">${escapeHtml(p.pergunta)}</div>
        ${!correta ? `<div class="review-answer wrong-answer">Sua resposta: <strong>${escapeHtml(respostaUsuarioTexto)}</strong></div>` : ''}
        <div class="review-answer">
          ${correta ? 'Você respondeu: ' : 'Resposta correta: '}
          <strong>${escapeHtml(respostaCorretaTexto)}</strong>
        </div>

          <h1 class="display" id="result-title">Você <em>conquistou</em> o prêmio.</h1>
          <p class="lede" style="text-align:center;">Domínio comprovado da Matriz SWOT. Seu nome está agora no ranking oficial.</p>

          <div class="score-display">
            <div>
              <div class="score-label">Acertos</div>
              <div style="display:flex;align-items:baseline;gap:8px;margin-top:4px;">
                <div class="score-value">${score}</div>
                <div class="score-total">/${perguntas.length}</div>

            </div>
            <div class="score-percent">${pct}%</div>

          <div class="btn-stack">
            <button class="btn btn-primary btn-block" id="btnVerRanking">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 4h3v5a3 3 0 0 1-3 3M7 4H4v5a3 3 0 0 0 3 3"/></svg>
              Ver ranking
            </button>
            <button class="btn btn-ghost btn-block" id="btnVerRevisao">

            <button class="btn btn-ghost btn-block" id="btnVoltarInicio">

        <div class="review-section" id="reviewSection" style="display:none;">

      <article class="card card--hero">
        <div class="result-badge lose" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>

        <span class="eyebrow">Quase lá, ${escapeHtml(state.nome)}</span>
        <h1 class="display" id="result-title">Você não atingiu o <em>mínimo</em>.</h1>
        <p class="lede" style="text-align:center;">Foram necessários ${MIN_ACERTOS} acertos para conquistar o prêmio. Revise seus erros e tente novamente.</p>

        <div class="score-display">
          <div>
            <div class="score-label">Acertos</div>

async function renderRanking() {
  const ranking = await getRanking();

  let tabela;
  if (ranking.length === 0) {
    tabela = `<div class="ranking-empty">Ainda não há jogadas registradas. Seja a primeira!</div>`;
  } else {
    const linhas = ranking.map((r, i) => {
      const data = new Date(r.created_at);
      const dataFormatada = `${String(data.getDate()).padStart(2,'0')}/${String(data.getMonth()+1).padStart(2,'0')}/${data.getFullYear()}`;

      const isAtual = state.jaSalvouResultado
        && r.nome === state.nome
        && r.acertos === state.scoreAtual;

      return `
        <tr class="${isAtual ? 'is-current' : ''}">
          <td class="rank-pos-cell">${i + 1}º</td>
          <td class="rank-name-cell">${escapeHtml(r.nome)}</td>
          <td class="rank-score-cell">${r.acertos}/${perguntas.length}</td>
          <td class="rank-date-cell">${dataFormatada}</td>
        </tr>
      `;
    }).join('');

    tabela = `
      <table class="ranking-full" aria-label="Ranking completo">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Nome</th>
            <th scope="col" style="text-align:right;">Pontos</th>
            <th scope="col" style="text-align:right;">Data</th>
          </tr>
        </thead>
        <tbody>${linhas}</tbody>
      </table>
    `;
  }

  return `
    <section class="screen is-active" aria-labelledby="ranking-title">
      <article class="card">
        <span class="eyebrow">Hall da fama</span>
        <h1 class="display" id="ranking-title">Ranking <em>oficial</em></h1>
        <p class="lede">Classificação de todos os participantes, ordenada pelo maior número de acertos.</p>

        ${tabela}

        <div class="btn-stack" style="margin-top:var(--space-6);">
          <button class="btn btn-primary btn-block" id="btnVoltarInicioRanking">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Voltar ao início
          </button>
          ${state.scoreAtual !== null ? `
            <button class="btn btn-ghost btn-block" id="btnTentarDeNovo">
              Jogar novamente
            </button>
          ` : ''}
        </div>
      </article>
    </section>
  `;
}

async function render() {
  const main = document.getElementById('main');
  let html = '';

  switch (state.tela) {
    case 'boasVindas':     html = await renderBoasVindas(); break;
    case 'quiz':           html = renderQuiz(); break;
    case 'resultado':      html = renderResultado(); break;
    case 'ranking':        html = await renderRanking(); break;
    case 'tempoExpirado':  html = renderTempoExpirado(); break;
  }

  main.innerHTML = html;
  attachHandlers();
}

function attachHandlers() {
  if (state.tela === 'boasVindas') {
    const input = document.getElementById('inputNome');
    const btnIniciar = document.getElementById('btnIniciar');
    const btnRanking = document.getElementById('btnVerRankingHome');

    input.addEventListener('input', (e) => {
      state.nome = e.target.value;
      btnIniciar.disabled = !state.nome.trim();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && state.nome.trim()) {
        iniciarQuiz();
      }
    });

    btnIniciar.addEventListener('click', iniciarQuiz);
    btnRanking.addEventListener('click', () => navigate('ranking'));

    setTimeout(() => input.focus(), 100);
  }

  else if (state.tela === 'quiz') {
    const idx = state.perguntaAtual;

    document.querySelectorAll('.choice').forEach(el => {
      el.addEventListener('click', () => {
        const opcaoIdx = parseInt(el.getAttribute('data-opcao'));
        state.respostas[idx] = opcaoIdx;
        document.querySelectorAll('.choice').forEach(c => {
          const isSel = parseInt(c.getAttribute('data-opcao')) === opcaoIdx;
          c.classList.toggle('is-selected', isSel);
          c.setAttribute('aria-checked', isSel ? 'true' : 'false');
        });
        document.getElementById('btnProximo').disabled = false;
      });
    });

    document.getElementById('btnAnterior').addEventListener('click', () => {
      if (idx > 0) {
        state.perguntaAtual--;
        render();
      }
    });

    document.getElementById('btnProximo').addEventListener('click', () => {
      if (state.respostas[idx] === null) return;

      if (idx < perguntas.length - 1) {
        state.perguntaAtual++;
        render();
      } else {
        finalizarQuiz();
      }
    });

    document.addEventListener('keydown', handleQuizKeyboard);
  }

  else if (state.tela === 'resultado') {
    if (state.scoreAtual >= MIN_ACERTOS) {
      dispararConfete();
    }

    const btnVerRanking = document.getElementById('btnVerRanking');
    const btnVoltarInicio = document.getElementById('btnVoltarInicio');
    const btnTentarNovamente = document.getElementById('btnTentarNovamente');
    const btnVerRevisao = document.getElementById('btnVerRevisao');

    if (btnVerRanking) btnVerRanking.addEventListener('click', () => navigate('ranking'));
    if (btnVoltarInicio) btnVoltarInicio.addEventListener('click', () => resetarQuiz(false));
    if (btnTentarNovamente) {
      btnTentarNovamente.addEventListener('click', () => {
        resetarQuiz(true);
        iniciarQuiz();
      });
    }
    if (btnVerRevisao) {
      btnVerRevisao.addEventListener('click', () => {
        const section = document.getElementById('reviewSection');
        const isHidden = section.style.display === 'none';
        section.style.display = isHidden ? 'block' : 'none';
        btnVerRevisao.textContent = isHidden ? 'Ocultar revisão' : 'Revisar respostas';
        if (isHidden) {
          section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    }
  }

  else if (state.tela === 'ranking') {
    document.getElementById('btnVoltarInicioRanking').addEventListener('click', () => resetarQuiz(false));
    const btnTentarDeNovo = document.getElementById('btnTentarDeNovo');
    if (btnTentarDeNovo) {
      btnTentarDeNovo.addEventListener('click', () => {
        resetarQuiz(true);
        iniciarQuiz();
      });
    }
  }

  else if (state.tela === 'tempoExpirado') {
    document.getElementById('btnVoltarInicio').addEventListener('click', () => resetarQuiz(false));
    document.getElementById('btnTentarDeNovoExpired').addEventListener('click', () => {
      resetarQuiz(true);
      iniciarQuiz();
    });
  }
}

function handleQuizKeyboard(e) {
  if (state.tela !== 'quiz') return;
  const key = e.key.toLowerCase();
  const map = { a: 0, b: 1, c: 2, d: 3 };

  if (key in map) {
    const idx = state.perguntaAtual;
    state.respostas[idx] = map[key];
    document.querySelectorAll('.choice').forEach(c => {
      const isSel = parseInt(c.getAttribute('data-opcao')) === map[key];
      c.classList.toggle('is-selected', isSel);
      c.setAttribute('aria-checked', isSel ? 'true' : 'false');
    });
    document.getElementById('btnProximo').disabled = false;
  }

  if (e.key === 'Enter') {
    const btnProximo = document.getElementById('btnProximo');
    if (!btnProximo.disabled) btnProximo.click();
  }
}

function iniciarQuiz() {
  if (!state.nome.trim()) return;
  state.tela = 'quiz';
  iniciarTimer();
  render();
}

async function finalizarQuiz() {
  if (state.isSubmitting) return;
  state.isSubmitting = true;
  pararTimer();
  
  const score = state.respostas.reduce((acc, resp, i) => resp === perguntas[i].respostaCorreta ? acc + 1 : acc, 0);
  state.scoreAtual = score;
  const erros = perguntas.length - score;
  const tempoGasto = TEMPO_TOTAL_SEGUNDOS - state.tempoRestante;

  const btnProximo = document.getElementById('btnProximo');
  if (btnProximo) {
    btnProximo.disabled = true;
    btnProximo.innerHTML = `<svg style="animation: spin 1s linear infinite" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10" /></svg> Salvando...`;
  }

  try {
    const isReady = await ensureSupabaseReady();
    if (!isReady || !supabaseClient) {
      throw new Error('Supabase não está pronto.');
    }

    const { data, error } = await supabaseClient.rpc('insert_quiz_result', {
      p_nome: state.nome.trim(),
      p_quiz_type: 'illuminati',
      p_perfil: null,
      p_tema: null,
      p_acertos: score,
      p_erros: erros,
      p_tempo_segundos: tempoGasto,
      p_swot_s: 0,
      p_swot_w: 0,
      p_swot_o: 0,
      p_swot_t: 0
    });

    if (error) throw error;

    if (data === 'DUPLICATE') {
      alert(`Atenção, ${state.nome}!\n\nNossa base de dados indica que você já realizou este quiz com este nome. Apenas a primeira tentativa é registrada no ranking.`);
      resetarQuiz(false);
      return;
    }

    state.jaSalvouResultado = true;
    navigate('resultado');
  } catch (err) {
    console.error('Erro ao salvar:', err);
    alert('Ocorreu um erro ao salvar seu resultado. Verifique sua conexão e tente novamente.');
    state.isSubmitting = false;
    if (btnProximo) {
      btnProximo.disabled = false;
      btnProximo.innerHTML = `Finalizar Quiz <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
    }
  }
}

const observer = new MutationObserver(() => {
  if (state.tela !== 'quiz') {
    document.removeEventListener('keydown', handleQuizKeyboard);
  }
});

document.addEventListener('DOMContentLoaded', () => {
  // Inicia o retry do Supabase no carregamento
  initSupabaseWithRetry();
  render();
});

// Fallback: se o SDK carregar depois do DOMContentLoaded
window.addEventListener('load', () => {
  if (!supabaseReady) {
    initSupabaseWithRetry();
  }
});
</script>

</body>
</html>
